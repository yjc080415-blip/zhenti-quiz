<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b45309" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>真题前30 听力刷题</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/app.css?v=5" />
  <link rel="icon" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast"></div>
  <script>
  (function () {
    var VER = "5";
    if (localStorage.getItem("zhenti-ui-ver") === VER) return;
    localStorage.setItem("zhenti-ui-ver", VER);
    var done = function () {
      location.replace(location.pathname + "?v=" + VER + location.hash);
    };
    if (!("serviceWorker" in navigator) || !window.caches) return;
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }),
      caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      })
    ]).then(done).catch(done);
  })();
  </script>
  <script src="./js/quiz.js?v=5"></script>
</body>
</html>
